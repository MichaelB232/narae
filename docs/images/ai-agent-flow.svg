<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1080" width="1100" height="1080" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Alur percakapan AI Agent NARAE</title>
<desc id="d">Pasien berbicara, ucapan diubah menjadi teks, dikirim ke backend, diproses agent Gemini dengan pemanggilan tool berulang maksimal empat ronde, disimpan ke log, dan jika pasien meminta perawat dibuat tiket bantuan sebelum jawaban dibacakan lewat text-to-speech.</desc>
