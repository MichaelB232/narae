services:
  db:
    image: postgres:16-alpine
    container_name: narae-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: narae
      POSTGRES_USER: narae
      POSTGRES_PASSWORD: narae_dev_password
    ports:
      - "5432:5432"
    volumes:
      - narae_db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U narae -d narae"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: narae-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://narae:narae_dev_password@db:5432/narae
      PORT: 4000
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      CORS_ORIGIN: "*"
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
    container_name: narae-frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Tidak perlu set VITE_API_URL: default di src/api/client.ts sudah http://localhost:4000/api,
    # dan karena browser (bukan container) yang akan memanggilnya, "localhost" di sini benar
    # merujuk ke mesin kamu sendiri tempat port 4000 sudah di-publish di atas.
    ports:
      - "5173:5173"

volumes:
  narae_db_data:
