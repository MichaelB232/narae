<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulasi Device Wearable – Jadwal dan Bantuan</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
 <div id="stage">
  <canvas id="cv"></canvas><div id="tip"></div><div id="pop"></div>
  <svg id="annsvg"></svg><div id="anns"></div>
  <div id="brand"><b>NARAE</b></div>
  <div id="toolbar" role="toolbar" aria-label="Kontrol tampilan 3D">
   <button class="tb" data-v="front">Depan</button>
   <button class="tb" data-v="top">Atas</button>
   <button class="tb" data-v="back">Belakang</button>
   <i class="sep"></i>
   <button class="tb" id="exb">Pecah komponen</button>
   <button class="tb on" id="rot" aria-pressed="true">Putar otomatis</button>
   <button class="tb on" id="ann" aria-pressed="true">Penjelasan</button>
   <i class="sep"></i>
   <button class="tb" id="pres">Mode presentasi</button>
  </div>
  <button class="tb" id="ptoggle" aria-controls="panel" aria-expanded="true">Sembunyikan panel</button>
 </div>
 <aside id="panel" aria-label="Panel kontrol">
  <div class="ph"><h1>Panel kontrol</h1><button class="tb" id="pclose" aria-label="Sembunyikan panel">Tutup</button></div>
  <details class="sec" open><summary>Pasien</summary>
   <select id="patientSelect" aria-label="Pasien yang disimulasikan"></select>
   <p class="hint">Satu gelang dipakai bergantian. Pilih pasien sebelum menekan tombol.</p>
  </details>
  <details class="sec"><summary>Komponen</summary><div id="list"></div></details>
  <details class="sec"><summary>Aktivitas</summary><div id="log"></div><button class="btn ghost" id="clr">Hapus riwayat</button></details>
  <details class="sec"><summary>Cara pakai</summary>
   <ul class="hint"><li>Klik/ketuk tombol di model untuk mencoba.</li><li>Seret = putar, scroll = zoom.</li><li><kbd>P</kbd> tampil/sembunyi panel, <kbd>Esc</kbd> keluar mode presentasi.</li></ul>
  </details>
 </aside>
</div>
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="js/config.js"></script>
<script src="js/core/bus.js"></script>
<script src="js/core/store.js"></script>
<script src="js/core/adapters/supabase.js"></script>
<script src="js/hardware/scene.js"></script>
<script src="js/hardware/parts/body.js"></script>
<script src="js/hardware/parts/strap.js"></script>
<script src="js/hardware/parts/jadwal.js"></script>
<script src="js/hardware/parts/bantuan.js"></script>
<script src="js/hardware/parts/ring.js"></script>
<script src="js/hardware/parts/led.js"></script>
<script src="js/hardware/parts/speaker.js"></script>
<script src="js/hardware/parts/mic.js"></script>
<script src="js/hardware/parts/contacts.js"></script>
<script src="js/hardware/buttons.js"></script>
<script src="js/hardware/hw.js"></script>
<script src="js/hardware/fx.js"></script>
<script src="js/ui/popup.js"></script>
<script src="js/hardware/speechInput.js"></script>
<script src="js/features/help-mode.js"></script>
<script src="js/features/actions.js"></script>
<script src="js/app/wiring.js"></script>
<script src="js/app/interaction.js"></script>
<script src="js/app/panel.js"></script>
<script src="js/app/annotations.js"></script>
<script src="js/app/loop.js"></script>
<script src="js/app/patientSelector.js"></script>
</body>
</html>
